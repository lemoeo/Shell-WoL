name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: python3 tests/installer/test_install.py
      - name: Native installer integration
        run: |
          go build -ldflags='-X main.version=v0.0.0-test' -o "$RUNNER_TEMP/shell-wol-test" ./cmd/shell-wol
          python3 tests/installer/smoke_native.py "$RUNNER_TEMP/shell-wol-test"
