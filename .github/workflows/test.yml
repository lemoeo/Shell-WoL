name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - run: sh scripts/template-checksums.sh --check
      - run: go test -race ./...
      - run: go vet ./...
      - name: VNC probe terminal smoke test
        run: |
          go build -o "$RUNNER_TEMP/mac-vnc-probe" ./cmd/mac-vnc-probe
          python3 tests/vnc_probe/smoke_terminal.py "$RUNNER_TEMP/mac-vnc-probe"
      - run: node tests/web/request.test.cjs
      - run: python3 -m unittest discover -s tests/installer -p 'test_*.py' -v
      - name: Native installer integration
        run: |
          go build -ldflags='-X main.version=v0.0.0-test' -o "$RUNNER_TEMP/shell-wol-test" ./cmd/shell-wol
          python3 tests/installer/smoke_native.py "$RUNNER_TEMP/shell-wol-test"
