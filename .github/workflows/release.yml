name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: shell-wol-release-assets
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          printf '%s\n' "$RELEASE_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$'
      - run: sh scripts/template-checksums.sh --check
      - run: go test -race ./...
      - run: go vet ./...
      - run: node tests/web/request.test.cjs
      - run: python3 -m unittest discover -s tests/installer -p 'test_*.py' -v
      - name: Native installer integration
        run: |
          go build -ldflags='-X main.version=v0.0.0-test' -o "$RUNNER_TEMP/shell-wol-test" ./cmd/shell-wol
          python3 tests/installer/smoke_native.py "$RUNNER_TEMP/shell-wol-test"
      - name: Build release assets
        env:
          VERSION: ${{ github.ref_name }}
        run: ./scripts/build.sh
      - name: Verify an existing Release before publishing CDN files
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          if existing=$(gh release view "$RELEASE_VERSION" --json isDraft --jq .isDraft 2> "$RUNNER_TEMP/release-view.err"); then
            [ "$existing" = false ] || { echo 'Existing Release is a draft; refusing to change it'; exit 1; }
            gh release download "$RELEASE_VERSION" --dir "$RUNNER_TEMP/existing-release" \
              --pattern VERSION --pattern SHA256SUMS
            cmp dist/VERSION "$RUNNER_TEMP/existing-release/VERSION"
            cmp dist/SHA256SUMS "$RUNNER_TEMP/existing-release/SHA256SUMS"
            echo 'present=true' >> "$GITHUB_OUTPUT"
            echo 'Existing Release matches this build; attachments unchanged.'
          else
            # A network/authentication failure is not evidence of a missing Release.
            grep -Eiq 'HTTP 404|release not found' "$RUNNER_TEMP/release-view.err" || { cat "$RUNNER_TEMP/release-view.err" >&2; exit 1; }
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish immutable CDN assets
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: bash scripts/publish-assets.sh snapshot "$RELEASE_VERSION" dist
      - name: Publish release
        if: ${{ steps.existing.outputs.present != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          # Explicit asset list excludes scripts and service templates.
          assets=(dist/VERSION dist/SHA256SUMS)
          while read -r digest binary; do
            assets+=("dist/$binary")
          done < dist/SHA256SUMS
          if printf '%s' "$RELEASE_VERSION" | grep -q -- '-'; then
            gh release create "$RELEASE_VERSION" "${assets[@]}" --verify-tag --generate-notes --prerelease
          else
            gh release create "$RELEASE_VERSION" "${assets[@]}" --verify-tag --generate-notes
          fi
      - name: Update CDN latest version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: bash scripts/publish-assets.sh latest "$RELEASE_VERSION"
